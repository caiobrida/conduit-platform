name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # >>> NOVO: instala o pnpm no runner antes de qualquer comando nx/pnpm
      - uses: pnpm/action-setup@v4

      # This enables task distribution via Nx Cloud
      # Roda cedo, antes do install — por isso continua com npx (o nx ainda não
      # está no node_modules). Agora funciona porque o pnpm já existe no runner.
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # era 20 — alinhe com seu Node local (24 LTS)
          cache: 'pnpm' # era 'npm'

      - run: pnpm install --frozen-lockfile # era: npm ci

      - run: pnpm run format:check
      # lint + test (Jest, todos os projetos) + build + typecheck + e2e —
      # mesmo comando disponível localmente via `pnpm run ci:check`
      - run: pnpm run ci:check
      - run: pnpm exec nx fix-ci
        if: always()
